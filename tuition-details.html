<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টিউশন বিস্তারিত</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #0A1A2F;
            --card-bg: #13233D;
            --primary: #3B82F6;
            --primary-hover: #2563EB;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --border-color: #1E3A5F;
            --icon-color: #3B82F6;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans Bengali', sans-serif;
            padding: 0 0 30px 0;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* ===== TSBD NAVBAR ===== */
        .tsbd-navbar {
            position: sticky;
            top: 0;
            z-index: 900;
            width: 100%;
            margin: 0 auto 28px;
            background: rgba(255, 255, 255, .96);
            border-bottom: 1px solid var(--border-color, #E5E7EB);
            box-shadow: 0 4px 18px rgba(15, 23, 42, .06);
            backdrop-filter: blur(12px)
        }

        .tsbd-nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px
        }

        .tsbd-logo {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #1F2937;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -.5px
        }

        .tsbd-logo-mark {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            display: grid;
            place-items: center;
            color: #fff;
            background: linear-gradient(135deg, #6366F1, #3B82F6);
            font-size: 14px;
            font-weight: 800;
            box-shadow: 0 5px 12px rgba(99, 102, 241, .25)
        }

        .tsbd-nav-links {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .tsbd-nav-link {
            border: 0;
            background: transparent;
            text-decoration: none;
            color: #4B5563;
            font-size: 14px;
            font-weight: 600;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: .2s ease
        }

        .tsbd-nav-link:hover {
            background: #F3F4F6;
            color: #4F46E5
        }

        .tsbd-nav-link.active {
            background: rgba(99, 102, 241, .12);
            color: #4F46E5;
            font-weight: 700
        }

        /* User Avatar & Dropdown */
        .tsbd-user {
            position: relative;
            display: none;
            align-items: center;
            margin-left: 4px
        }

        .tsbd-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #6366F1;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
            user-select: none
        }

        .tsbd-avatar:hover {
            transform: scale(1.06);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .2)
        }

        .tsbd-avatar:active {
            transform: scale(0.96)
        }

        .tsbd-avatar-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            min-width: 140px;
            background: #ffffff;
            border: 1px solid #E5E7EB;
            border-radius: 10px;
            padding: 6px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, .12), 0 8px 10px -6px rgba(0, 0, 0, .08);
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px);
            transition: opacity .22s cubic-bezier(.16, 1, .3, 1), transform .22s cubic-bezier(.16, 1, .3, 1), visibility .22s ease;
            z-index: 1000;
            pointer-events: none
        }

        .tsbd-avatar-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            pointer-events: auto
        }

        .tsbd-avatar-dropdown .tsbd-logout {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border-radius: 6px;
            color: #EF4444;
            font-size: 14px;
            font-weight: 600;
            background: transparent;
            border: 0;
            cursor: pointer;
            transition: .2s ease;
            white-space: nowrap
        }

        .tsbd-avatar-dropdown .tsbd-logout:hover {
            background: rgba(239, 68, 68, .1);
            color: #DC2626
        }

        .tsbd-menu-btn {
            display: none;
            width: 42px;
            height: 42px;
            border: 1px solid #E5E7EB;
            background: #fff;
            border-radius: 10px;
            cursor: pointer;
            font-size: 19px;
            color: #1F2937;
            align-items: center;
            justify-content: center
        }

        .tsbd-drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .4);
            z-index: 1090;
            opacity: 0;
            visibility: hidden;
            transition: .25s ease
        }

        .tsbd-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: min(82vw, 320px);
            height: 100vh;
            background: #fff;
            z-index: 1100;
            padding: 22px;
            box-shadow: -10px 0 30px rgba(15, 23, 42, .15);
            transform: translateX(100%);
            transition: transform .28s ease;
            display: flex;
            flex-direction: column
        }

        .tsbd-drawer.open {
            transform: translateX(0)
        }

        .tsbd-drawer-overlay.open {
            opacity: 1;
            visibility: visible
        }

        .tsbd-drawer-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 14px;
            border-bottom: 1px solid #E5E7EB
        }

        .tsbd-close {
            border: 0;
            background: #F3F4F6;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            display: grid;
            place-items: center
        }

        .tsbd-drawer .tsbd-nav-link {
            width: 100%;
            justify-content: flex-start;
            padding: 12px 14px;
            margin-bottom: 6px;
            font-size: 15px
        }

        /* Mobile Drawer User Dropdown */
        .tsbd-mobile-user-wrap {
            margin-top: 10px;
            border-top: 1px solid #E5E7EB;
            padding-top: 8px
        }

        .tsbd-mobile-user-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            cursor: pointer;
            border-radius: 8px;
            transition: background .2s ease
        }

        .tsbd-mobile-user-row:hover {
            background: #F3F4F6
        }

        .tsbd-mobile-caret {
            margin-left: auto;
            font-size: 12px;
            color: #9CA3AF;
            transition: transform .25s ease
        }

        .tsbd-mobile-user-wrap.open .tsbd-mobile-caret {
            transform: rotate(180deg)
        }

        .tsbd-mobile-dropdown {
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transform: translateY(-4px);
            transition: opacity .25s ease, transform .25s ease, max-height .25s ease;
            padding: 0 10px
        }

        .tsbd-mobile-dropdown.show {
            opacity: 1;
            max-height: 80px;
            transform: translateY(0);
            padding: 6px 10px
        }

        .tsbd-mobile-dropdown .tsbd-logout {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 8px;
            color: #EF4444;
            font-size: 14px;
            font-weight: 600;
            background: transparent;
            border: 0;
            cursor: pointer;
            transition: .2s ease
        }

        .tsbd-mobile-dropdown .tsbd-logout:hover {
            background: rgba(239, 68, 68, .1);
            color: #DC2626
        }

        @media(max-width:768px) {
            .tsbd-nav-links {
                display: none
            }

            .tsbd-menu-btn {
                display: flex
            }

            .tsbd-user {
                display: none !important
            }
        }

        .tuition-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .tuition-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            margin-top: 0;
        }

        .time-ago {
            display: inline-flex;
            gap: 6px;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .status-badge {
            color: white;
            font-size: 13px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .job-meta {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .job-meta strong {
            color: var(--text-main);
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            row-gap: 16px;
            column-gap: 10px;
            margin-bottom: 25px;
        }

        @media(max-width: 600px) {
            .details-grid {
                grid-template-columns: 1fr;
            }
        }

        .grid-item {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .label-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .label-row .icon {
            color: var(--icon-color);
            width: 18px;
            text-align: center;
            font-size: 16px;
        }

        .value-row {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            margin-left: 26px;
            margin-top: 2px;
        }

        .card-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
            text-align: center;
            width: 100%;
        }

        .btn-apply {
            background-color: var(--primary);
            color: white;
            flex: 1;
        }

        .btn-apply:hover {
            background-color: var(--primary-hover);
        }

        .btn-apply:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-share {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
        }

        .btn-share:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        #application-form-section {
            display: none;
        }

        .form-title {
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-weight: 600;
        }

        input[type="text"],
        input[type="tel"],
        select,
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .radio-group {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .result-box {
            display: none;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            line-height: 1.5;
        }

        .result-success {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .result-waiting {
            background-color: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--warning);
            color: var(--warning);
        }

        .policy-box {
            background: rgba(59, 130, 246, 0.06);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
        }

        .policy-box .btn {
            margin-top: 8px;
        }

        #policy-agree {
            accent-color: var(--primary);
        }

        #loading {
            display: none;
            text-align: center;
            color: var(--warning);
            margin-top: 15px;
            font-weight: 600;
        }

        #details-loading {
            text-align: center;
            color: var(--text-muted);
            font-size: 18px;
            padding: 40px;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            margin-top: 15px;
            border: 1px solid var(--danger);
        }

        .already-applied-msg {
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            margin-top: 15px;
            border: 1px solid var(--primary);
        }

        #profile-found-box {
            display: none;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            border-radius: 8px;
            padding: 15px;
            margin-top: -8px;
            margin-bottom: 20px;
        }

        #profile-found-box p {
            margin: 0 0 10px 0;
            color: var(--success);
            font-weight: 600;
        }

        #profile-found-box .profile-name {
            color: var(--text-main);
        }

        #profile-checking {
            display: none;
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 6px;
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
            padding: 0;
        }
    </style>
</head>

            if (!date) return "Recently";
            const seconds = Math.max(0, Math.floor((new Date() - date) / 1000));

            let interval = seconds / 86400;
            if (interval >= 1) return Math.floor(interval) + (Math.floor(interval) === 1 ? " day ago" : " days ago");

            interval = seconds / 3600;
            if (interval >= 1) return Math.floor(interval) + (Math.floor(interval) === 1 ? " hour ago" : " hours ago");

            interval = seconds / 60;
            if (interval >= 1) return Math.floor(interval) + " minutes ago";

            return "Just now";
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();

                reader.onload = () => {
                    const result = String(reader.result || "");
                    const commaIndex = result.indexOf(",");
                    if (commaIndex === -1) {
                        reject(new Error("ফাইল Base64 এ রূপান্তর করা যায়নি।"));
                        return;
                    }
                    resolve(result.substring(commaIndex + 1));
                };

                reader.onerror = () => reject(new Error("ফাইল পড়তে সমস্যা হয়েছে।"));
                reader.onabort = () => reject(new Error("ফাইল পড়া বাতিল হয়েছে।"));
                reader.readAsDataURL(file);
            });
        }

            } catch (networkError) {
                throw new Error(
                    "Google Apps Script-এ সংযোগ করা যাচ্ছে না। GAS Web App URL এবং deployment check করুন।"
                );
            }

            const rawText = await response.text();

            if (!response.ok) {
                throw new Error(`ফাইল আপলোড সার্ভার error (${response.status})`);
            }

            let result;
            try {
                result = JSON.parse(rawText);
            } catch (parseError) {
                console.error("Invalid GAS response:", rawText);
                throw new Error(
                    "Google Apps Script JSON response দেয়নি। GAS-এর doPost() এবং deployment settings পরীক্ষা করুন।"
                );
            }

            if (result.status === "duplicate") {
                return result;
            }

            if (result.status !== "success") {
                throw new Error(result.message || "ফাইল আপলোড ব্যর্থ হয়েছে!");
            }

            if (!result.nidUrl || !result.msUrl) {
                throw new Error("ফাইল আপলোড হয়েছে, কিন্তু Drive URL পাওয়া যায়নি।");
            }

            return result;
        }

        // Only the tuition policy is shown after Apply.
        // Tutor information is taken from the already-registered tutor profile.
        document.getElementById("submit-btn").addEventListener("click", async () => {
            const submitBtn = document.getElementById("submit-btn");
            const loading = document.getElementById("loading");
            const agree = document.getElementById("policy-agree");
            const selectedCommission = document.querySelector('input[name="commission"]:checked');

            if (submitBtn.disabled) return;
            if (!selectedCommission) {
                alert("একটি কমিশন পলিসি নির্বাচন করুন.");
                return;
            }
            if (!agree.checked) {
                alert("আবেদন করতে হলে টিউশন পলিসিতে সম্মতি দিতে হবে।");
                return;
            }

            const phone = String(
                localStorage.getItem("tutorPhone") ||
                sessionStorage.getItem("tutorPhone") || ""
            ).trim();
            const phoneRegex = /^01[3-9]\d{8}$/;

            if (!phoneRegex.test(phone)) {
                alert("প্রথমে টিউটর হিসেবে রেজিস্ট্রেশন/লগইন করুন। তারপর টিউশনে আবেদন করুন।");
                window.location.href = "tutor-registration.html";
                return;
            }
            if (ADMIN_PHONES.includes(phone)) {
                alert("অ্যাডমিন নাম্বার দিয়ে আবেদন করা যাবে না!");
                return;
            }

            submitBtn.disabled = true;
            loading.style.display = "block";

            try {
                // Registered tutor documents may be keyed by UID or by phone for older profiles.
                let tutorSnap = await getDoc(doc(db, "tutors", phone));
                if (!tutorSnap.exists()) {
                    const tutorQuery = query(collection(db, "tutors"), where("phone", "==", phone));
                    const tutorResults = await getDocs(tutorQuery);
                    if (!tutorResults.empty) tutorSnap = tutorResults.docs[0];
                }

                if (!tutorSnap.exists()) {
                    alert("আপনার টিউটর প্রোফাইল পাওয়া যায়নি। আগে টিউটর রেজিস্ট্রেশন সম্পন্ন করুন।");
                    window.location.href = "tutor-registration.html";
                    return;
                }

                const tutorData = tutorSnap.data();
                const tutorName = tutorData.name || "";
                const institute = tutorData.institute || tutorData.institution || "";
                const address = tutorData.address || "";
                const gender = tutorData.gender || "";
                const email = tutorData.email || "";
                const nidUrl = tutorData.nidFileUrl || tutorData.nidUrl || "";
                const msUrl = tutorData.marksheetFileUrl || tutorData.msUrl || "";
                const nidFileId = tutorData.nidFileId || "";
                const msFileId = tutorData.marksheetFileId || "";

                if (!tutorName || !institute || !address || !gender) {
                    throw new Error("আপনার টিউটর প্রোফাইল অসম্পূর্ণ। আগে টিউটর প্রোফাইল সম্পূর্ণ করুন।");
                }
                if (!nidUrl || !msUrl) {
                    throw new Error("আপনার NID/Birth Certificate ও Marksheet প্রোফাইলে পাওয়া যায়নি। আগে টিউটর রেজিস্ট্রেশন সম্পূর্ণ করুন।");
                }

                const tuitionRef = doc(db, "tuitions", tuitionId);
                const applicationsRef = collection(db, "applications");

                const duplicateQuery = query(
                    applicationsRef,
                    where("tuitionId", "==", tuitionId),
                    where("phone", "==", phone)
                );
                const duplicateSnap = await getDocs(duplicateQuery);
                if (!duplicateSnap.empty) throw new Error("Already Applied");

                const result = await runTransaction(db, async (transaction) => {
                    const tuitionDoc = await transaction.get(tuitionRef);
                    if (!tuitionDoc.exists()) throw new Error("টিউশনটি পাওয়া যায়নি!");

                    const currentCount = Number(tuitionDoc.data().applicantsCount || 0);
                    if (currentCount >= 3) throw new Error("Already Full");

                    const rank = currentCount;
                    let statusMsg = "";
                    let finalStatus = "";

                    if (rank === 0) {
                        finalStatus = "Selected";
                        statusMsg = `
                        <strong>অভিনন্দন! আপনি প্রথম আবেদনকারী।</strong><br><br>
                        অভিভাবকের নাম্বার:
                        <span style="font-size:24px;font-weight:bold;color:var(--text-main);display:block;margin:10px 0;">
                            ${escapeHtml(tuitionDoc.data().guardianPhone || "N/A")}
                        </span>
                        দয়া করে দ্রুত অভিভাবকের সাথে যোগাযোগ করুন।
                    `;
                    } else if (rank === 1) {
                        finalStatus = "Waiting List";
                        statusMsg = `
                        <strong>আপনার আবেদন গৃহীত হয়েছে।</strong><br><br>
                        <span style="color:var(--warning);">You are in our waiting list at <strong>2nd</strong> position.</span><br>
                        প্রথম শিক্ষক টিউশনটি না নিলে আপনাকে অভিভাবকের নাম্বারটি প্রদান করা হবে।
                    `;
                    } else {
                        finalStatus = "Waiting List";
                        statusMsg = `
                        <strong>আপনার আবেদন গৃহীত হয়েছে।</strong><br><br>
                        <span style="color:var(--warning);">You are in our waiting list at <strong>3rd</strong> position.</span><br>
                        আগের শিক্ষক টিউশনটি না নিলে আপনাকে অভিভাবকের নাম্বারটি প্রদান করা হবে।
                    `;
                    }

                    transaction.update(tuitionRef, { applicantsCount: currentCount + 1 });
                    return { statusMsg, finalStatus };
                });

                await addDoc(applicationsRef, {
                    tuitionId,
                    uid: tutorSnap.id,
                    tutorName,
                    institute,
                    email,
                    phone,
                    address,
                    gender,
                    commissionPolicy: selectedCommission.value,
                    nidFileUrl: nidUrl,
                    marksheetFileUrl: msUrl,
                    nidFileId,
                    marksheetFileId: msFileId,
                    appliedAt: serverTimestamp(),
                    status: result.finalStatus
                });

                localStorage.setItem(`applied_${tuitionId}`, "true");
                document.getElementById("application-form-section").style.display = "none";

                const resultBox = document.getElementById("result-message");
                resultBox.style.display = "block";
                resultBox.className =
                    result.finalStatus === "Selected"
                        ? "result-box result-success"
                        : "result-box result-waiting";
                resultBox.innerHTML = result.statusMsg;

                // Auto WhatsApp Message to 1st Applicant (Selected Tutor)
                if (result.finalStatus === "Selected") {
                    const guardianPhoneNum = (currentTuitionData?.guardianPhone || "N/A");
                    const formattedWaMsg = formatTutorSuccessWhatsAppMessage(currentTuitionData || {}, phone, guardianPhoneNum);

                    // 1. Trigger background WhatsApp Bot API
                    sendAutoWhatsAppToTutor(phone, formattedWaMsg).then(res => {
                        if (res.success) {
                            console.log("✅ Auto WhatsApp sent to tutor:", phone);
                        }
                    }).catch(err => {
                        console.warn("Auto WA notice:", err);
                    });

                    // 2. Add 1-Click WhatsApp Save Button for tutor convenience
                    const cleanPhone = phone.replace(/[^0-9]/g, '');
                    const waDirectUrl = `https://api.whatsapp.com/send?phone=88${cleanPhone}&text=${encodeURIComponent(formattedWaMsg)}`;
                    resultBox.innerHTML += `
                        <div style="margin-top: 18px; padding-top: 16px; border-top: 1px dashed rgba(255,255,255,0.2); text-align: center;">
                            <a href="${waDirectUrl}" target="_blank" rel="noopener" style="background:#22C55E; color:#FFFFFF; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 22px; border-radius:8px; text-decoration:none; font-weight:700; font-size:14px; box-shadow:0 4px 14px rgba(34,197,94,0.4); transition:all 0.2s ease;">
                                <i class="fa-brands fa-whatsapp" style="font-size:20px;"></i> হোয়াটসঅ্যাপে সম্পূর্ণ তথ্য সংরক্ষণ করুন
                            </a>
                        </div>
                    `;
                }

            } catch (error) {
                console.error("Application error:", error);
                const message = error instanceof Error ? error.message : String(error);

                if (message === "Already Full") {
                    alert("দুঃখিত, আবেদন করার সময়ের মধ্যেই ৩ জনের কোটা পূর্ণ হয়ে গেছে।");
                    location.reload();
                } else if (message === "Already Applied") {
                    alert("আপনি ইতিমধ্যে এই টিউশনের জন্য আবেদন করেছেন!");
                    document.getElementById("application-form-section").style.display = "none";
                } else {
                    alert("আবেদন করতে সমস্যা হয়েছে:\n\n" + message);
                }
            } finally {
                submitBtn.disabled = false;
                loading.style.display = "none";
            }
        });

    </script>
</body>

</html>
