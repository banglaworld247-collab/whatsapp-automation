<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এভেইলেবল টিউশন সমূহ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #F4F7FA;
            --card-bg: #FFFFFF;
            --primary: #6366F1; /* Primary Purple/Blue for Apply button */
            --primary-hover: #4F46E5;
            --text-dark: #1F2937;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --icon-color: #3B82F6;
            --success-bg: #10B981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
        }

        .header-title {
            text-align: center;
            color: var(--text-dark);
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 700;
        }

        /* Grid Layout */
        .tuition-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Card Styling */
        .tuition-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .tuition-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .tuition-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .time-ago {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background-color: #F3F4F6;
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .status-badge {
            background-color: var(--success-bg);
            color: white;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .job-meta {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        /* Details Grid inside Card */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 10px;
            margin-bottom: 20px;
        }

        .info-block {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .full-width {
            grid-column: span 2;
        }

        .info-icon {
            color: var(--icon-color);
            font-size: 16px;
            margin-top: 3px;
            width: 20px;
            text-align: center;
        }

        .info-text {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .info-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* Action Buttons */
        .card-actions {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-apply {
            background-color: var(--primary);
            color: white;
            flex: 1;
        }

        .btn-apply:hover {
            background-color: var(--primary-hover);
        }

        .btn-share {
            background-color: transparent;
            color: var(--text-dark);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 0.8;
        }

        .btn-share:hover {
            background-color: #F9FAFB;
        }

        /* Loading & Empty State */
        #loading-message {
            text-align: center;
            font-size: 18px;
            color: var(--text-muted);
            margin-top: 50px;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            font-size: 18px;
            background-color: var(--card-bg);
            border-radius: 12px;
            max-width: 600px;
            margin: 0 auto;
            border: 1px dashed var(--border-color);
        }

        /* ===== TSBD NAVBAR ===== */
        /* ===== TSBD NAVBAR ===== */
        .tsbd-navbar{position:sticky;top:0;z-index:900;width:100%;margin:0 auto 28px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border-color,#E5E7EB);box-shadow:0 4px 18px rgba(15,23,42,.06);backdrop-filter:blur(12px)}
        .tsbd-nav-inner{max-width:1200px;margin:0 auto;min-height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
        .tsbd-logo{text-decoration:none;display:inline-flex;align-items:center;gap:10px;color:#1F2937;font-weight:800;font-size:22px;letter-spacing:-.5px}
        .tsbd-logo-mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#6366F1,#3B82F6);font-size:14px;font-weight:800;box-shadow:0 5px 12px rgba(99,102,241,.25)}
        .tsbd-nav-links{display:flex;align-items:center;gap:8px}
        .tsbd-nav-link{border:0;background:transparent;text-decoration:none;color:#4B5563;font-size:14px;font-weight:600;padding:9px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.2s ease}
        .tsbd-nav-link:hover{background:#F3F4F6;color:#4F46E5}
        .tsbd-nav-link.active{background:rgba(99,102,241,.12);color:#4F46E5;font-weight:700}
        
        /* User Avatar & Dropdown */
        .tsbd-user{position:relative;display:none;align-items:center;margin-left:4px}
        .tsbd-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #6366F1;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;user-select:none}
        .tsbd-avatar:hover{transform:scale(1.06);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
        .tsbd-avatar:active{transform:scale(0.96)}
        
        .tsbd-avatar-dropdown{position:absolute;top:calc(100% + 10px);right:0;min-width:140px;background:#ffffff;border:1px solid #E5E7EB;border-radius:10px;padding:6px;box-shadow:0 10px 25px -5px rgba(0,0,0,.12),0 8px 10px -6px rgba(0,0,0,.08);opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .22s cubic-bezier(.16,1,.3,1),transform .22s cubic-bezier(.16,1,.3,1),visibility .22s ease;z-index:1000;pointer-events:none}
        .tsbd-avatar-dropdown.show{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}
        .tsbd-avatar-dropdown .tsbd-logout{display:flex;width:100%;align-items:center;gap:8px;padding:9px 12px;border-radius:6px;color:#EF4444;font-size:14px;font-weight:600;background:transparent;border:0;cursor:pointer;transition:.2s ease;white-space:nowrap}
        .tsbd-avatar-dropdown .tsbd-logout:hover{background:rgba(239,68,68,.1);color:#DC2626}
        
        .tsbd-menu-btn{display:none;width:42px;height:42px;border:1px solid #E5E7EB;background:#fff;border-radius:10px;cursor:pointer;font-size:19px;color:#1F2937;align-items:center;justify-content:center}
        .tsbd-drawer-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:1090;opacity:0;visibility:hidden;transition:.25s ease}
        .tsbd-drawer{position:fixed;top:0;right:0;width:min(82vw,320px);height:100vh;background:#fff;z-index:1100;padding:22px;box-shadow:-10px 0 30px rgba(15,23,42,.15);transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column}
        .tsbd-drawer.open{transform:translateX(0)}.tsbd-drawer-overlay.open{opacity:1;visibility:visible}
        .tsbd-drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid #E5E7EB}
        .tsbd-close{border:0;background:#F3F4F6;width:38px;height:38px;border-radius:8px;cursor:pointer;font-size:18px;display:grid;place-items:center}
        .tsbd-drawer .tsbd-nav-link{width:100%;justify-content:flex-start;padding:12px 14px;margin-bottom:6px;font-size:15px}
        
        /* Mobile Drawer User Dropdown */
        .tsbd-mobile-user-wrap{margin-top:10px;border-top:1px solid #E5E7EB;padding-top:8px}
        .tsbd-mobile-user-row{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-radius:8px;transition:background .2s ease}
        .tsbd-mobile-user-row:hover{background:#F3F4F6}
        .tsbd-mobile-caret{margin-left:auto;font-size:12px;color:#9CA3AF;transition:transform .25s ease}
        .tsbd-mobile-user-wrap.open .tsbd-mobile-caret{transform:rotate(180deg)}
        .tsbd-mobile-dropdown{opacity:0;max-height:0;overflow:hidden;transform:translateY(-4px);transition:opacity .25s ease,transform .25s ease,max-height .25s ease;padding:0 10px}
        .tsbd-mobile-dropdown.show{opacity:1;max-height:80px;transform:translateY(0);padding:6px 10px}
        .tsbd-mobile-dropdown .tsbd-logout{display:flex;width:100%;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;color:#EF4444;font-size:14px;font-weight:600;background:transparent;border:0;cursor:pointer;transition:.2s ease}
        .tsbd-mobile-dropdown .tsbd-logout:hover{background:rgba(239,68,68,.1);color:#DC2626}
        
        @media(max-width:768px){body{padding:12px}.tsbd-navbar{margin:-12px -12px 24px;width:calc(100% + 24px);}.tsbd-nav-links{display:none}.tsbd-menu-btn{display:flex}.tsbd-user{display:none!important}}

    </style>
</head>
<body>

    <!-- TSBD NAVBAR -->
    <nav class="tsbd-navbar">
        <div class="tsbd-nav-inner">
            <a class="tsbd-logo" href="tuitions-offers.html" aria-label="Tuition Service BD"><span class="tsbd-logo-mark">TS</span><span>TSBD</span></a>
            <div class="tsbd-nav-links">
                <a class="tsbd-nav-link active" href="tuitions-offers.html"><i class="fa-solid fa-list"></i> টিউশন অফার</a>
                <a class="tsbd-nav-link" href="tutors.html"><i class="fa-solid fa-chalkboard-user"></i> টিউটরস</a>

                    <img class="tsbd-avatar" id="tsbdDesktopAvatar" alt="Google profile" title="প্রোফাইল মেনু">
                    <div class="tsbd-avatar-dropdown" id="tsbdAvatarDropdown">
                        <button class="tsbd-logout" id="tsbdDesktopLogout" type="button"><i class="fa-solid fa-right-from-bracket"></i> লগআউট</button>

            <button class="tsbd-menu-btn" id="tsbdMenuBtn" type="button" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
        </div>
    </nav>
    <div class="tsbd-drawer-overlay" id="tsbdDrawerOverlay"></div>
    <aside class="tsbd-drawer" id="tsbdDrawer" aria-hidden="true">
        <div class="tsbd-drawer-head"><a class="tsbd-logo" href="tuitions-offers.html"><span class="tsbd-logo-mark">TS</span><span>TSBD</span></a><button class="tsbd-close" id="tsbdClose" type="button" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></button></div>
        <a class="tsbd-nav-link active" href="tuitions-offers.html"><i class="fa-solid fa-list"></i> টিউশন অফার</a>
        <a class="tsbd-nav-link" href="tutors.html"><i class="fa-solid fa-chalkboard-user"></i> টিউটরস</a>
        <a class="tsbd-nav-link" href="partner.html"><i class="fa-solid fa-handshake"></i> পার্টনার যোগ দিন</a>
        <a class="tsbd-nav-link" id="adminDashboardLinkMobile" href="admin-dashboard.html" style="display:none;"><i class="fa-solid fa-gauge-high"></i> ড্যাশবোর্ড</a>
        <a class="tsbd-nav-link" id="loginLinkMobile" href="tutor-registration.html"><i class="fa-solid fa-right-to-bracket"></i> লগইন</a>
        <div id="tsbdMobileUser" class="tsbd-mobile-user-wrap" style="display:none;">
            <div class="tsbd-mobile-user-row" id="tsbdMobileUserToggle">
                <img class="tsbd-avatar" id="tsbdMobileAvatar" alt="Google profile">
                <span style="font-size:14px;font-weight:600;color:#374151" id="tsbdMobileName">Signed in</span>
                <i class="fa-solid fa-chevron-down tsbd-mobile-caret"></i>
            </div>
            <div class="tsbd-mobile-dropdown" id="tsbdMobileDropdown">
                <button class="tsbd-logout" id="tsbdMobileLogout" type="button"><i class="fa-solid fa-right-from-bracket"></i> লগআউট</button>
            </div>
        </div>
    </aside>

    <h2 class="header-title">এভেইলেবল টিউশন সমূহ</h2>
    
    <div id="loading-message">টিউশন লোড হচ্ছে...</div>
    <div id="tuition-grid" class="tuition-grid" style="display: none;"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // === আপনার ফায়ারবেস কনফিগ এখানে বসান ===
        const firebaseConfig = {
            apiKey: "AIzaSyB_22O8J69EUb8rF4FXZrjM-AHgPwOQAtA",
            authDomain: "cms-of-jts.firebaseapp.com",
            projectId: "cms-of-jts",
            storageBucket: "cms-of-jts.firebasestorage.app",
            messagingSenderId: "300970842151",
            appId: "1:300970842151:web:9885ce2a591cf5f4eed602",
            measurementId: "G-TRJNGCB98F"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        setPersistence(auth, browserLocalPersistence);

        // ===== TSBD NAVBAR AUTH UI =====
        const tsbdDrawer = document.getElementById("tsbdDrawer");
        const tsbdOverlay = document.getElementById("tsbdDrawerOverlay");
        const tsbdMenuBtn = document.getElementById("tsbdMenuBtn");
        const tsbdClose = document.getElementById("tsbdClose");

        function tsbdOpenDrawer(){if(tsbdDrawer){tsbdDrawer.classList.add("open");tsbdOverlay.classList.add("open");tsbdDrawer.setAttribute("aria-hidden","false");document.body.style.overflow="hidden"}}
        function tsbdCloseDrawer(){if(tsbdDrawer){tsbdDrawer.classList.remove("open");tsbdOverlay.classList.remove("open");tsbdDrawer.setAttribute("aria-hidden","true");document.body.style.overflow=""}}
        tsbdMenuBtn?.addEventListener("click", tsbdOpenDrawer);
        tsbdClose?.addEventListener("click", tsbdCloseDrawer);
        tsbdOverlay?.addEventListener("click", tsbdCloseDrawer);

        // Dropdown toggle elements
        const desktopAvatar = document.getElementById('tsbdDesktopAvatar');
        const desktopDropdown = document.getElementById('tsbdAvatarDropdown');
        const mobileUserToggle = document.getElementById('tsbdMobileUserToggle');
        const mobileUserWrap = document.getElementById('tsbdMobileUser');
        const mobileDropdown = document.getElementById('tsbdMobileDropdown');

        desktopAvatar?.addEventListener('click', (e) => {
            e.stopPropagation();
            desktopDropdown?.classList.toggle('show');
        });

        mobileUserToggle?.addEventListener('click', (e) => {
            e.stopPropagation();
            mobileUserWrap?.classList.toggle('open');
            mobileDropdown?.classList.toggle('show');
        });

        document.addEventListener('click', (e) => {
            if (desktopDropdown && !desktopDropdown.contains(e.target) && e.target !== desktopAvatar) {
                desktopDropdown.classList.remove('show');
            }
        });

        const ALLOWED_ADMIN_EMAILS = ["banglaworld247@gmail.com"];

        function isAdminUser(u) {
            if (!u || !u.email) return false;
            return ALLOWED_ADMIN_EMAILS.includes(u.email.toLowerCase().trim());
        }

        function tsbdSetUser(user){
            const desktopUser = document.getElementById('tsbdDesktopUser');
            const mobileUser = document.getElementById('tsbdMobileUser');
            const desktopAvatar = document.getElementById('tsbdDesktopAvatar');
            const mobileAvatar = document.getElementById('tsbdMobileAvatar');
            const mobileName = document.getElementById('tsbdMobileName');
            const loginLink = document.getElementById('loginLink');
            const loginLinkMobile = document.getElementById('loginLinkMobile');
            const adminDashboardLink = document.getElementById('adminDashboardLink');
            const adminDashboardLinkMobile = document.getElementById('adminDashboardLinkMobile');

            const isAdmin = isAdminUser(user);
            if (adminDashboardLink) adminDashboardLink.style.display = isAdmin ? "inline-flex" : "none";
            if (adminDashboardLinkMobile) adminDashboardLinkMobile.style.display = isAdmin ? "inline-flex" : "none";

            if(user){
                const photo = user.photoURL || (user.providerData && user.providerData[0]?.photoURL) || localStorage.getItem('tutorPhotoURL') || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName||user.email||(isAdmin ? 'Admin' : 'Tutor'))}&background=6366F1&color=fff`;
                if(desktopAvatar) desktopAvatar.src = photo;
                if(mobileAvatar) mobileAvatar.src = photo;
                if(mobileName) mobileName.textContent = user.displayName || user.email || localStorage.getItem('tutorDisplayName') || "লগইন আছেন";
                if(desktopUser) desktopUser.style.display = "inline-flex";
                if(mobileUser) mobileUser.style.display = "block";
                if(loginLink) loginLink.style.display = "none";
                if(loginLinkMobile) loginLinkMobile.style.display = "none";
            } else {
                if(desktopUser) desktopUser.style.display = "none";
                if(mobileUser) mobileUser.style.display = "none";
                if(desktopDropdown) desktopDropdown.classList.remove('show');
                if(mobileDropdown) mobileDropdown.classList.remove('show');
                if(loginLink) loginLink.style.display = "inline-flex";
                if(loginLinkMobile) loginLinkMobile.style.display = "inline-flex";
            }
        }

        // Preload cached avatar and admin status immediately on page load
        const cachedPhoto = localStorage.getItem('tutorPhotoURL');
        const cachedName = localStorage.getItem('tutorDisplayName');
        const cachedEmail = localStorage.getItem('userEmail');
        if (cachedPhoto || cachedEmail) {
            tsbdSetUser({ photoURL: cachedPhoto, displayName: cachedName, email: cachedEmail });
        }

        async function tsbdLogout(){
            try {
                await signOut(auth);
                localStorage.removeItem("tutorPhotoURL");
                localStorage.removeItem("tutorDisplayName");
                localStorage.removeItem("userEmail");
                localStorage.removeItem("tutorPhone");
                sessionStorage.removeItem("tutorPhone");
                sessionStorage.removeItem("tutorSession");
                tsbdCloseDrawer();
                window.location.reload();
            } catch(e) {
                console.error("Logout error:", e);
                alert("Logout failed. Please try again.");
            }
        }
        document.getElementById("tsbdDesktopLogout")?.addEventListener("click", tsbdLogout);
        document.getElementById("tsbdMobileLogout")?.addEventListener("click", tsbdLogout);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const photo = user.photoURL || (user.providerData && user.providerData[0]?.photoURL) || '';
                if (photo) localStorage.setItem("tutorPhotoURL", photo);
                if (user.displayName || user.email) localStorage.setItem("tutorDisplayName", user.displayName || user.email);
                if (user.email) localStorage.setItem("userEmail", user.email);
                tsbdSetUser(user);
            } else {
                localStorage.removeItem("tutorPhotoURL");
                localStorage.removeItem("tutorDisplayName");
                localStorage.removeItem("userEmail");
                tsbdSetUser(null);
            }
        });

        const db = getFirestore(app);

        const gridContainer = document.getElementById('tuition-grid');
        const loadingMessage = document.getElementById('loading-message');

        const tuitionsRef = collection(db, "tuitions");
        const q = query(tuitionsRef, where("status", "==", "open"), orderBy("createdAt", "desc"));

        onSnapshot(q, (snapshot) => {
            loadingMessage.style.display = 'none';
            gridContainer.style.display = 'grid';
            gridContainer.innerHTML = '';

            if (snapshot.empty) {
                gridContainer.style.display = 'block';
                gridContainer.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size:40px; margin-bottom:10px;">📋</div>
                        এই মুহূর্তে কোনো নতুন টিউশন খালি নেই।<br>নতুন টিউশন আসলে এখানে অটোমেটিক আপডেট হবে।
                    </div>
                `;
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                
                // Fallbacks in case older posts are missing the newly added fields
                const jobId = data.jobId || "N/A";
                const postedDate = data.postedDate || "Recently";
                const tuitionType = data.tuitionType || "home tuition";
                const category = data.category || "Bangla Medium";
                const preferredTutor = data.preferredTutor || "Any";
                const noOfStudents = data.noOfStudents || "1";
                
                // Generate Dynamic Title from Class, Subject, and Note if available
                const titleText = data.specialNotes ? data.specialNotes : `${data.className} এর শিক্ষার্থীর জন্য ${data.studentGender} শিক্ষক প্রয়োজন ${data.subject} পড়াতে হবে`;

                const card = document.createElement('div');
                card.className = 'tuition-card';
                
                card.innerHTML = `
                    <h3 class="tuition-title">${titleText}</h3>
                    
                    <div class="time-ago">
                        <i class="far fa-clock"></i> New
                    </div>
                    
                    <br>
                    <span class="status-badge">AVAILABLE</span>
                    
                    <div class="job-meta">
                        Job Id : <strong>${jobId}</strong> &nbsp;&nbsp;|&nbsp;&nbsp; Posted: <strong>${postedDate}</strong>
                    </div>

                    <div class="details-grid">
                        <div class="info-block">
                            <i class="fa-solid fa-house-user info-icon"></i>
                            <div class="info-text">
                                <span class="info-label">Tuition Type</span>
                                <span class="info-value">${tuitionType}</span>
                            </div>
                        </div>
                        <div class="info-block">
                            <i class="fa-solid fa-venus-mars info-icon"></i>
                            <div class="info-text">
                                <span class="info-label">Student Gender</span>
                                <span class="info-value">${data.studentGender}</span>
                            </div>
                        </div>
                        <div class="info-block">
                            <i class="fa-solid fa-layer-group info-icon"></i>
                            <div class="info-text">
                                <span class="info-label">Category</span>
                                <span class="info-value">${category}</span>
                            </div>
                        </div>
                        <div class="info-block">
                            <i class="fa-solid fa-user-graduate info-icon"></i>
                            <div class="info-text">
                                <span class="info-label">Class</span>
                                <span class="info-value">${data.className}</span>
                            </div>
                        </div>
                        <div class="info-block">
                            <i class="fa-solid fa-money-bill-wave info-icon"></i>
                            <div class="info-text">
                                <span class="info-label">Salary</span>
                                <span class="info-value">${data.salary}</span>
                            </div>
                        </div>
                        <div class="info-block">
                            <i class="fa-solid fa-chalkboard-user info-icon"></i>
                            <div class="info-text">
                                <span class="info-label">Preferred Tutor</span>
                                <span class="info-value">${preferredTutor}</span>
                            </div>
                        </div>
                        <div class="info-block">
                            <i class="fa-regular fa-clock info-icon"></i>
                            <div class="info-text">
                                <span class="info-label">Tutoring Time</span>
                                <span class="info-value">${data.time}</span>
                            </div>
                        </div>
                        <div class="info-block">
                            <i class="fa-regular fa-calendar-alt info-icon"></i>
                            <div class="info-text">
                                <span class="info-label">Tutoring Days</span>
                                <span class="info-value">${data.days}</span>
                            </div>
                        </div>
                        <div class="info-block">
                            <i class="fa-solid fa-location-dot info-icon"></i>
                            <div class="info-text">
                                <span class="info-label">Location</span>
                                <span class="info-value">${data.location}</span>
                            </div>
                        </div>
                        <div class="info-block">
                            <i class="fa-solid fa-users info-icon"></i>
                            <div class="info-text">
                                <span class="info-label">No. of Students</span>
                                <span class="info-value">${noOfStudents}</span>
                            </div>
                        </div>
                        <div class="info-block full-width">
                            <i class="fa-solid fa-book info-icon"></i>
                            <div class="info-text">
                                <span class="info-label">Subjects</span>
                                <span class="info-value">${data.subject}</span>
                            </div>
                        </div>
                    </div>

                    <div class="card-actions">
                        <button class="btn btn-apply" onclick="viewDetails('${id}')">Apply</button>
                        <button class="btn btn-share" onclick="shareJob('${id}')">
                            <i class="fa-solid fa-share-nodes"></i> Share
                        </button>
                    </div>
                `;
                gridContainer.appendChild(card);
            });
        }, (error) => {
            loadingMessage.innerHTML = `<span style="color: #EF4444;">দুঃখিত, ডেটা লোড করতে সমস্যা হয়েছে। রিফ্রেশ করুন।</span>`;
            console.error("Firestore Error:", error);
        });

        // Redirect Logic for Details Page
        window.viewDetails = function(tuitionId) {
            window.location.href = `tuition-details.html?id=${tuitionId}`;
        };

        // Share Logic
        window.shareJob = function(tuitionId) {
            const shareUrl = window.location.origin + `/tuition-details.html?id=` + tuitionId;
            if (navigator.share) {
                navigator.share({
                    title: 'টিউশন অফার',
                    text: 'এই টিউশন অফারটি দেখুন!',
                    url: shareUrl
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(shareUrl);
                alert('লিংক কপি করা হয়েছে: ' + shareUrl);
            }
        };
    </script>
</body>
</html>
